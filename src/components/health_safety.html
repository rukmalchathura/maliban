<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maliban Wovens - Health & Safety Section</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html2pdf.js for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            maliban: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    /* Toggle Switch Styles */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #ef4444;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #ef4444;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-sky-500 selection:text-white">

  <!-- TOP HEADER BANNER -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Left: Facility & Audit Branding -->
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-sky-500/20">
            MW
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="text-lg font-bold text-white tracking-tight">Maliban Wovens (Pvt) Ltd</h1>
              <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-slate-800 text-sky-400 border border-slate-700">
                Balangoda Plant
              </span>
            </div>
            <p class="text-xs text-slate-400 flex items-center gap-2">
              <span><i data-lucide="map-pin" class="w-3 h-3 inline"></i> Balangoda, Sri Lanka</span>
              <span>&bull;</span>
              <span><i data-lucide="shield-check" class="w-3 h-3 inline"></i> Section 2: Health &amp; Safety Compliance</span>
            </p>
          </div>
        </div>

        <!-- Middle: Dynamic Score & Section Compliance Status -->
        <div class="flex items-center space-x-6">
          <div id="hsRatingBadgeContainer" class="px-4 py-2 rounded-xl border flex items-center space-x-3 transition-all duration-300 bg-emerald-950/60 border-emerald-500/40 text-emerald-300">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center">
              <i data-lucide="shield-check" class="w-5 h-5 text-emerald-400"></i>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider font-semibold opacity-80">H&amp;S Compliance Status</div>
              <div id="hsRatingBadgeText" class="text-sm font-bold tracking-wide text-emerald-300">COMPLIANT</div>
            </div>
          </div>

          <!-- Total Score Gauge -->
          <div class="text-center px-4 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700">
            <div class="text-[10px] uppercase text-slate-400 font-medium">H&amp;S Score</div>
            <div id="hsScorePercentageText" class="text-xl font-black text-sky-400">100.0%</div>
            <div id="hsScorePointsSubtext" class="text-[10px] text-slate-400">0 / 0 pts</div>
          </div>
        </div>

        <!-- Right: Action Buttons -->
        <div class="flex items-center space-x-2">
          <a href="#" class="px-3 py-2 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
            <i data-lucide="arrow-left" class="w-4 h-4 text-sky-400"></i>
            <span>Back</span>
          </a>
          <button onclick="saveHealthSafetyData()" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-sky-600 hover:bg-sky-500 text-white flex items-center gap-1.5 shadow-lg shadow-sky-600/30 transition">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>Save H&amp;S Audit</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN DUAL-COLUMN LAYOUT -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT SIDEBAR: SUBSECTION NAVIGATION & PROGRESS (4 COLUMNS) -->
    <aside class="lg:col-span-4 space-y-4">
      <div class="glass-card rounded-2xl p-4 sticky top-24 space-y-3">
        
        <div class="flex items-center justify-between px-2 pb-2 border-b border-slate-800">
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="list-checks" class="w-4 h-4 text-sky-400"></i>
            <span>Sub-Sections</span>
          </h2>
          <span id="hsOverallProgressBadge" class="text-xs font-semibold text-sky-400 px-2 py-0.5 rounded bg-sky-950 border border-sky-800">
            0% Complete
          </span>
        </div>

        <nav id="hsSidebarNav" class="space-y-1.5 max-h-[calc(100vh-200px)] overflow-y-auto pr-1">
          <!-- Rendered dynamically via JavaScript -->
        </nav>

      </div>
    </aside>

    <!-- MAIN CONTENT AREA: SUBSECTION CARDS WITH QUESTIONS, FILES & COMMENTS (8 COLUMNS) -->
    <main class="lg:col-span-8 space-y-6">
      
      <!-- Current Section Header -->
      <div class="glass-card rounded-2xl p-5 flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-sky-400 uppercase tracking-wide">Section 2 of Audit Component</div>
          <h2 class="text-xl font-extrabold text-white mt-0.5">Health &amp; Safety Compliance Audit</h2>
        </div>
        <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center border border-slate-700">
          <i data-lucide="shield-alert" class="w-6 h-6 text-sky-400"></i>
        </div>
      </div>

      <!-- Subsections & Questions Container -->
      <div id="hsSubsectionsContainer" class="space-y-6">
        <!-- Rendered dynamically -->
      </div>

    </main>
  </div>

  <!-- JAVASCRIPT STATE MANAGEMENT & COMPONENT CONTROLLERS -->
  <script>
    // HARDCODED HEALTH & SAFETY DATASET
    // For brevity in the code structure, only a subset of sections is included but fully demonstrates the logic.
    const HEALTH_SAFETY_DATA = [
      {
        id: 'sec-1.0',
        code: '1.0',
        title: 'General Work Environment',
        subsections: [
          {
            code: '1.1',
            title: 'Airborne Particulates',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_1.1_1', text: 'Does the facility generate airborne particulates (dust/ fibers/ mists /fumes) through its operations/ production processes?' },
              { id: 'hs_1.1_2', text: 'Does the facility evaluate exposure to concentrations of airborne particulates (dust/ fibers/ mists /fumes) in line with legal requirements?' },
              { id: 'hs_1.1_3', text: 'Are worker exposures to airborne particulates (e.g. dust, fibers, fumes) in line with legal requirements?' }
            ]
          },
          {
            code: '1.2',
            title: 'Temperature and Ventilation',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_1.2_1', text: 'Are temperature and ventilation systems maintained in line with legal requirements?' },
              { id: 'hs_1.2_2', text: 'Are facility temperature and ventilation in line with applicable legal requirements?' },
              { id: 'hs_1.2_3', text: 'Does the facility continuously monitor and maintain a specific regulated indoor temperature?' },
              { id: 'hs_1.2_4', text: 'If yes, what is the indoor temperature in Celsius the facility continuously maintains?' }
            ]
          },
          {
            code: '1.3',
            title: 'Air Quality',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_1.3_1', text: 'Does the facility monitor indoor air quality in line with legal requirements?' }
            ]
          },
          {
            code: '1.4',
            title: 'Lighting',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_1.4_1', text: 'Is facility lighting in line with legal requirements?' }
            ]
          },
          {
            code: '1.5',
            title: 'Noise Exposure Levels',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_1.5_1', text: 'Does the facility test noise exposure levels in line with legal requirements?' },
              { id: 'hs_1.5_2', text: 'Are worker exposures to noise in line with legal requirements?' }
            ]
          }
        ]
      },
      {
        id: 'sec-2.0',
        code: '2.0',
        title: 'Overcrowding & Sanitation',
        subsections: [
          {
            code: '2.1',
            title: 'Cleanliness, Sanitation & Waste',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_2.1_1', text: 'Is the workplace clean and tidy?' },
              { id: 'hs_2.1_2', text: 'Are the facility\'s sanitation practices in line with legal requirements?' },
              { id: 'hs_2.1_3', text: 'Are the facility\'s waste disposal practices in line with legal requirements?' },
              { id: 'hs_2.1_4', text: 'Are waste disposal/discharge permits available and up to date?' }
            ]
          },
          {
            code: '2.2',
            title: 'Toilet / Restroom',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_2.2_1', text: 'Are toilets in line with legal requirements?' },
              { id: 'hs_2.2_2', text: 'Are separate toilets provided for males and females?' }
            ]
          }
        ]
      },
      {
        id: 'sec-3.0',
        code: '3.0',
        title: 'Emergency Preparedness',
        subsections: [
          {
            code: '3.1',
            title: 'Fire Detection and Alarm',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_3.1_1', text: 'Does the facility have a fire detection and alarm system in place?' },
              { id: 'hs_3.1_2', text: 'Emergency alarm system is fully functioning and tested?' }
            ]
          },
          {
            code: '3.2',
            title: 'Emergency Exits',
            comment: '',
            attachments: [],
            questions: [
              { id: 'hs_3.2_1', text: 'Are there sufficient emergency exits from all work stations and rest areas?' },
              { id: 'hs_3.2_2', text: 'Are all emergency exits clearly marked and unlocked during working hours?' }
            ]
          }
        ]
      }
    ];

    // LOCAL STORAGE STATE INITIALIZATION
    const LOCAL_STORAGE_KEY = 'maliban_hs_section_data_v3';
    let hsDataStore;

    const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (savedData) {
      hsDataStore = JSON.parse(savedData);
    } else {
      // Initialize with default 'YES' answers and default properties for new marking scheme
      hsDataStore = JSON.parse(JSON.stringify(HEALTH_SAFETY_DATA));
      hsDataStore.forEach(section => {
        section.subsections.forEach(sub => {
          sub.questions.forEach(q => {
            q.answer = 'YES';
            q.severity = 'NONE';
            q.legalFlag = false;
          });
        });
      });
    }

    // STATE CONTROLLERS & RENDERING
    let activeSubsectionCode = '1.1';

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebarNav();
      renderSubsections();
      recalculateHsScore();
      lucide.createIcons();
    });

    // RENDER SIDEBAR NAVIGATION
    function renderSidebarNav() {
      const navContainer = document.getElementById('hsSidebarNav');
      navContainer.innerHTML = '';

      let totalQuestions = 0;
      let totalAnswered = 0;

      hsDataStore.forEach(section => {
        const secHeader = document.createElement('div');
        secHeader.className = 'px-2 pt-3 pb-1 text-[11px] font-extrabold text-sky-400 uppercase tracking-wider flex items-center justify-between';
        secHeader.innerHTML = `<span>${section.code} ${section.title}</span>`;
        navContainer.appendChild(secHeader);

        section.subsections.forEach(sub => {
          const subTotal = sub.questions.length;
          // Count as answered if not UNANSWERED
          const subAnswered = sub.questions.filter(q => q.answer && q.answer !== 'UNANSWERED').length;
          
          totalQuestions += subTotal;
          totalAnswered += subAnswered;

          const isActive = sub.code === activeSubsectionCode;
          const isComplete = subAnswered === subTotal;

          const btn = document.createElement('button');
          btn.onclick = () => scrollToSubsection(sub.code);
          btn.className = `w-full text-left px-3 py-2 rounded-xl transition flex items-center justify-between text-xs border ${
            isActive 
              ? 'bg-sky-950/80 border-sky-500/60 font-bold text-sky-300 shadow-md' 
              : 'bg-slate-900/60 border-slate-800/80 text-slate-300 hover:bg-slate-800/70 hover:border-slate-700'
          }`;

          btn.innerHTML = `
            <span class="flex items-center gap-2 truncate">
              <span class="px-1.5 py-0.5 rounded bg-slate-950 text-[10px] font-mono text-slate-400 border border-slate-800">${sub.code}</span>
              <span class="truncate">${sub.title}</span>
            </span>
            <span class="text-[10px] ${isComplete ? 'text-emerald-400 font-bold' : 'text-slate-400'}">${subAnswered}/${subTotal}</span>
          `;

          navContainer.appendChild(btn);
        });
      });

      const overallPct = totalQuestions > 0 ? Math.round((totalAnswered / totalQuestions) * 100) : 0;
      document.getElementById('hsOverallProgressBadge').innerText = `${overallPct}% Complete`;
    }

    // SCROLL TO SUBSECTION
    function scrollToSubsection(subCode) {
      activeSubsectionCode = subCode;
      renderSidebarNav();
      const targetElement = document.getElementById(`sub-${subCode}`);
      if (targetElement) {
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // RENDER MAIN SUBSECTIONS CONTENT
    function renderSubsections() {
      const mainContainer = document.getElementById('hsSubsectionsContainer');
      mainContainer.innerHTML = '';

      hsDataStore.forEach(section => {
        section.subsections.forEach(sub => {
          const card = document.createElement('div');
          card.id = `sub-${sub.code}`;
          card.className = 'glass-card rounded-2xl border border-slate-800 overflow-hidden shadow-xl space-y-4 p-5';

          card.innerHTML = `
            <!-- SUBSECTION HEADER -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-1 rounded-lg bg-sky-950 text-sky-400 text-xs font-bold border border-sky-800 font-mono">${sub.code}</span>
                <h3 class="text-base font-extrabold text-white tracking-wide">${sub.title}</h3>
              </div>
              <span class="text-xs font-semibold text-slate-400">${sub.questions.length} Questions</span>
            </div>

            <!-- QUESTIONS LIST -->
            <div class="space-y-4">
              ${sub.questions.map((q, qIdx) => {
                const isNA = q.answer === 'NA' || q.answer === 'NO APPLICABLE LEGAL REQUIREMENT';
                return `
                  <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800/80 flex flex-col gap-3 transition-colors hover:border-slate-600">
                    <!-- Top Row: Question & Primary Answer -->
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                      <div class="text-xs font-medium text-slate-200 leading-relaxed flex-1 pt-1">
                        <span class="text-slate-400 font-semibold mr-1.5">${sub.code}.${qIdx + 1}</span>
                        <span>${q.text}</span>
                      </div>
                      <div class="shrink-0 flex items-center">
                        <select onchange="updateQuestionAnswer('${sub.code}', '${q.id}', this.value)" class="w-full sm:w-auto px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-700 text-sky-300 text-xs font-bold focus:outline-none focus:border-sky-500 shadow">
                          <option value="YES" ${q.answer === 'YES' ? 'selected' : ''}>YES</option>
                          <option value="PARTIAL" ${q.answer === 'PARTIAL' ? 'selected' : ''}>PARTIAL</option>
                          <option value="NO" ${q.answer === 'NO' ? 'selected' : ''}>NO</option>
                          <option value="NA" ${q.answer === 'NA' ? 'selected' : ''}>N/A</option>
                        </select>
                      </div>
                    </div>
                    
                    <!-- Bottom Row: Severity & Legal Flag (Hidden if NA) -->
                    <div id="flags-${q.id}" class="flex flex-wrap items-center gap-6 mt-1 pt-3 border-t border-slate-800/50 ${isNA ? 'hidden' : 'flex'}">
                      
                      <!-- Severity Dropdown -->
                      <div class="flex items-center gap-2">
                        <label class="text-[10px] uppercase font-bold text-slate-400">Severity:</label>
                        <select onchange="updateQuestionSeverity('${sub.code}', '${q.id}', this.value)" class="px-2 py-1 rounded bg-slate-950 border border-slate-700 text-[11px] text-slate-300 focus:outline-none focus:border-sky-500">
                          <option value="NONE" ${q.severity === 'NONE' || !q.severity ? 'selected' : ''}>None</option>
                          <option value="MINOR" ${q.severity === 'MINOR' ? 'selected' : ''}>Minor</option>
                          <option value="MAJOR" ${q.severity === 'MAJOR' ? 'selected' : ''}>Major</option>
                          <option value="CRITICAL" ${q.severity === 'CRITICAL' ? 'selected' : ''}>Critical</option>
                        </select>
                      </div>

                      <!-- Legal Requirement Flag -->
                      <div class="flex items-center gap-2">
                        <label class="text-[10px] uppercase font-bold text-slate-400">Legal Issue:</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" class="sr-only peer" onchange="updateQuestionLegalFlag('${sub.code}', '${q.id}', this.checked)" ${q.legalFlag ? 'checked' : ''}>
                          <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-red-500"></div>
                        </label>
                      </div>

                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- FILE ATTACHMENT & COMMENT SECTION FOR SUBSECTION -->
            <div class="pt-3 border-t border-slate-800/80 grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              
              <!-- File Attachment Zone -->
              <div class="space-y-2">
                <label class="block font-bold text-sky-300 flex items-center gap-1.5">
                  <i data-lucide="paperclip" class="w-3.5 h-3.5 text-sky-400"></i>
                  <span>Sub-Section ${sub.code} Evidence / Documents</span>
                </label>
                
                <div 
                  class="border-2 border-dashed border-sky-800/60 hover:border-sky-400 rounded-xl p-3 text-center cursor-pointer transition-all bg-sky-950/20 hover:bg-sky-950/40"
                  onclick="document.getElementById('file-input-${sub.code}').click()"
                  ondragover="event.preventDefault()"
                  ondrop="handleFileDrop(event, '${sub.code}')"
                >
                  <i data-lucide="upload-cloud" class="w-6 h-6 text-sky-400 mx-auto mb-1"></i>
                  <p class="text-sky-300 font-semibold text-[11px]">Click or Drag &amp; Drop Evidence</p>
                  <input type="file" id="file-input-${sub.code}" class="hidden" multiple accept="image/*,.pdf" onchange="handleFileUpload('${sub.code}', this.files)">
                </div>

                <!-- Attachment List -->
                <div id="attachments-${sub.code}" class="space-y-1.5">
                  ${sub.attachments.map((att, attIdx) => `
                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800 text-[11px]">
                      <span class="truncate font-medium text-slate-300 max-w-[180px]">${att.name}</span>
                      <button onclick="removeAttachment('${sub.code}', ${attIdx})" class="text-red-400 hover:text-red-300 ml-2">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Subsection Comment Zone -->
              <div class="space-y-2">
                <label class="block font-bold text-sky-300 flex items-center gap-1.5">
                  <i data-lucide="message-square" class="w-3.5 h-3.5 text-sky-400"></i>
                  <span>Auditor Observations &amp; Comments</span>
                </label>
                <textarea 
                  onchange="updateSubComment('${sub.code}', this.value)"
                  rows="4" 
                  placeholder="Leave findings, comments or notes for ${sub.title}..."
                  class="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 text-xs"
                >${sub.comment || ''}</textarea>
              </div>

            </div>
          `;

          mainContainer.appendChild(card);
        });
      });

      lucide.createIcons();
    }

    // UPDATE QUESTION ANSWER (AND CONDITIONALLY RESET FLAGS)
    function updateQuestionAnswer(subCode, questionId, value) {
      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          const q = sub.questions.find(q => q.id === questionId);
          if (q) {
            q.answer = value;
            // If Answer is N/A, severity and legal flags reset & get hidden
            if (value === 'NA' || value === 'NO APPLICABLE LEGAL REQUIREMENT') {
              q.severity = 'NONE';
              q.legalFlag = false;
            }
            saveHealthSafetyData();
            recalculateHsScore();
            renderSubsections(); // Re-render to correctly hide/show the flags block
            renderSidebarNav();
            break;
          }
        }
      }
    }

    // UPDATE SEVERITY
    function updateQuestionSeverity(subCode, questionId, value) {
      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          const q = sub.questions.find(q => q.id === questionId);
          if (q) {
            q.severity = value;
            saveHealthSafetyData();
            recalculateHsScore();
            break;
          }
        }
      }
    }

    // UPDATE LEGAL FLAG
    function updateQuestionLegalFlag(subCode, questionId, value) {
      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          const q = sub.questions.find(q => q.id === questionId);
          if (q) {
            q.legalFlag = value;
            saveHealthSafetyData();
            recalculateHsScore();
            break;
          }
        }
      }
    }

    // UPDATE SUBSECTION COMMENT
    function updateSubComment(subCode, commentText) {
      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          sub.comment = commentText;
          saveHealthSafetyData();
          break;
        }
      }
    }

    // FILE ATTACHMENT HANDLERS
    function handleFileUpload(subCode, files) {
      if (!files || files.length === 0) return;

      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          Array.from(files).forEach(f => {
            sub.attachments.push({
              name: f.name,
              size: (f.size / 1024).toFixed(1) + ' KB',
              type: f.type
            });
          });
          saveHealthSafetyData();
          renderSubsections();
          break;
        }
      }
    }

    function handleFileDrop(event, subCode) {
      event.preventDefault();
      if (event.dataTransfer && event.dataTransfer.files) {
        handleFileUpload(subCode, event.dataTransfer.files);
      }
    }

    function removeAttachment(subCode, index) {
      for (const section of hsDataStore) {
        const sub = section.subsections.find(s => s.code === subCode);
        if (sub) {
          sub.attachments.splice(index, 1);
          saveHealthSafetyData();
          renderSubsections();
          break;
        }
      }
    }

    // SAVE TO LOCAL STORAGE
    function saveHealthSafetyData() {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(hsDataStore));
    }

    // RECALCULATE HEALTH & SAFETY SCORE (100% Proportional System)
    function recalculateHsScore() {
      let totalQuestions = 0;
      let applicableQuestions = 0;
      let earnedPoints = 0;
      
      let hasMajorOrCritical = false;
      let hasLegalFlag = false;

      hsDataStore.forEach(sec => {
        sec.subsections.forEach(sub => {
          sub.questions.forEach(q => {
            totalQuestions++;
            
            // Skip N/A questions in the scoring denominator entirely
            if (q.answer !== 'NA' && q.answer !== 'NO APPLICABLE LEGAL REQUIREMENT' && q.answer !== 'UNANSWERED') {
              applicableQuestions++;
              
              // Scoring logic
              if (q.answer === 'YES') {
                earnedPoints += 1;
              } else if (q.answer === 'PARTIAL') {
                earnedPoints += 0.5;
              }
              // 'NO' awards 0 points

              // Track Severe Flags
              if (q.severity === 'MAJOR' || q.severity === 'CRITICAL') hasMajorOrCritical = true;
              if (q.legalFlag === true) hasLegalFlag = true;
            }
          });
        });
      });

      // Calculate final percentage score
      let scorePct = 100.0;
      if (applicableQuestions > 0) {
        scorePct = ((earnedPoints / applicableQuestions) * 100).toFixed(1);
      }
      
      document.getElementById('hsScorePercentageText').innerText = `${scorePct}%`;
      document.getElementById('hsScorePointsSubtext').innerText = `${earnedPoints} / ${applicableQuestions} pts`;

      const badgeContainer = document.getElementById('hsRatingBadgeContainer');
      const badgeText = document.getElementById('hsRatingBadgeText');

      // Update Header Compliance Status based on Findings
      if (hasMajorOrCritical || hasLegalFlag || scorePct < 70) {
        badgeContainer.className = 'px-4 py-2 rounded-xl border flex items-center space-x-3 transition-all duration-300 bg-red-950/60 border-red-500/40 text-red-300';
        badgeText.innerText = hasMajorOrCritical ? 'CRITICAL RISK' : 'ACTION REQUIRED';
        badgeContainer.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center">
            <i data-lucide="shield-alert" class="w-5 h-5 text-red-400"></i>
          </div>
          <div>
            <div class="text-[10px] uppercase tracking-wider font-semibold opacity-80">H&amp;S Compliance Status</div>
            <div id="hsRatingBadgeText" class="text-sm font-bold tracking-wide text-red-300">${badgeText.innerText}</div>
          </div>
        `;
      } else if (scorePct < 100) {
        badgeContainer.className = 'px-4 py-2 rounded-xl border flex items-center space-x-3 transition-all duration-300 bg-amber-950/60 border-amber-500/40 text-amber-300';
        badgeText.innerText = 'NEEDS IMPROVEMENT';
        badgeContainer.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400"></i>
          </div>
          <div>
            <div class="text-[10px] uppercase tracking-wider font-semibold opacity-80">H&amp;S Compliance Status</div>
            <div id="hsRatingBadgeText" class="text-sm font-bold tracking-wide text-amber-300">${badgeText.innerText}</div>
          </div>
        `;
      } else {
        badgeContainer.className = 'px-4 py-2 rounded-xl border flex items-center space-x-3 transition-all duration-300 bg-emerald-950/60 border-emerald-500/40 text-emerald-300';
        badgeText.innerText = 'COMPLIANT';
        badgeContainer.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center">
            <i data-lucide="shield-check" class="w-5 h-5 text-emerald-400"></i>
          </div>
          <div>
            <div class="text-[10px] uppercase tracking-wider font-semibold opacity-80">H&amp;S Compliance Status</div>
            <div id="hsRatingBadgeText" class="text-sm font-bold tracking-wide text-emerald-300">COMPLIANT</div>
          </div>
        `;
      }
      
      // Re-initialize Lucide icons in case the badge icon changed
      if (window.lucide) {
        lucide.createIcons();
      }
    }
  </script>
</body>
